name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site (PowerShell)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "./shivasharanu portfolio/build.ps1"
        shell: pwsh

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: './shivasharanu portfolio/dist'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
